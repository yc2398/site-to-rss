feed:
  title: "Site-to-RSS Aggregator"
  subtitle: "Monitor website changes, delivered as RSS · Updated daily"
  author: "RSS Bot"
  # CHANGE THIS to your GitHub Pages URL:
  base_url: "https://yc2398.github.io/site-to-rss"
  repo_url: "https://github.com/yc2398/site-to-rss"

sources:
  # ──────────────────────────────────────────────────────────────
  # Big Data & Society - Sage Journals
  # ──────────────────────────────────────────────────────────────
  - id: bds
    name: Big Data & Society
    type: webpage_items
    url: "https://sage.cnpereading.com/home/BDS"
    items:
      selector: "article"
      title:
        selector: "h3 a"
      link:
        selector: "h3 a"
        attribute: "href"
      author:
        selector: ".journal-detail__author > span:first-child"
        multiple: true
      date:
        selector: ".journal-detail__tag[aria-label*='Publication date']"
        attribute: "aria-label"
        regex: 'Publication date:\s*(.+)'
    tags: [big-data, society, open-access]
