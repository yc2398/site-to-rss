name: Language Teaching Research OnlineFirst RSS

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 16:00
    - cron: "0 8 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ltr-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Create directories
        run: |
          mkdir -p scripts
          mkdir -p data
          mkdir -p docs/feeds

      - name: Generate RSS
        run: |
          python scripts/generate_ltr_rss.py

      - name: Validate RSS
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("docs/feeds/ltr-onlinefirst.xml")

          if not path.exists():
              raise RuntimeError("RSS file does not exist")

          tree = ET.parse(path)
          root = tree.getroot()

          assert root.tag == "rss"
          assert root.attrib.get("version") == "2.0"

          channel = root.find("channel")

          if channel is None:
              raise RuntimeError("RSS channel missing")

          items = channel.findall("item")

          if not items:
              raise RuntimeError("RSS contains zero items")

          print(f"RSS validation OK: {len(items)} items")
          PY

      - name: Commit updated RSS and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ltr_articles.json
          git add docs/feeds/ltr-onlinefirst.xml

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update LTR OnlineFirst RSS"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
