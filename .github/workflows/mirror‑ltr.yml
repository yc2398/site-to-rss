name: Mirror Language Teaching Research RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p docs/feeds
      - run: curl -L "https://journals.sagepub.com/rss/ltr.xml" -o docs/feeds/ltr-mirror.xml
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-pages:
    needs: fetch-rss
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
